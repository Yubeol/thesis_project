name: Ingest papers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Maximum metadata candidates to acquire
        required: false
        type: number
        default: 300

      minimum:
        description: Minimum English papers required after processing
        required: false
        type: number
        default: 50

  schedule:
    # UTC 16:30
    # KST 다음날 01:30
    - cron: '30 16 * * *'


permissions:
  contents: read


concurrency:
  group: ingest-papers
  cancel-in-progress: false


jobs:

  # ==========================================================
  # JOB 1
  #
  # GitHub Hosted Runner
  #
  # OpenAlex
  #   ↓
  # OA PDF / HTML 다운로드
  #   ↓
  # 논문 전처리
  #   ↓
  # Entity Resolution
  #   ↓
  # Artifact 생성
  # ==========================================================

  collect:
    name: Collect and preprocess papers

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main


      # ------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt


      # ------------------------------------------------------
      # 4. Tests
      # ------------------------------------------------------

      - name: Run paper pipeline tests
        run: |
          python -m unittest discover \
            -s tests/pipeline \
            -p 'test_paper*.py' \
            -v


      # ------------------------------------------------------
      # 5. OpenAlex metadata collection
      #
      # 실제 논문 원문 다운로드 전
      # 후보 논문 metadata를 수집한다.
      # ------------------------------------------------------

      - name: Collect OpenAlex paper metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

        run: |
          TARGET="${{ github.event.inputs.target }}"

          if [ -z "$TARGET" ]; then
            TARGET=300
          fi

          echo "PAPER_TARGET=$TARGET"

          python -m pipeline.papers.collector.openalex \
            --target "$TARGET" \
            --minimum 1


      # ------------------------------------------------------
      # 6. Acquire OA sources
      #
      # 중요
      #
      # 이제 continue-on-error를 사용하지 않는다.
      #
      # download.py 내부에서:
      #
      # 개별 논문 다운로드 실패
      # → 재시도
      # → unavailable 처리
      # → 다음 논문 계속
      #
      # 전체 source 확보가 0건인 경우에만
      # download.py가 exit 1을 반환한다.
      # ------------------------------------------------------

      - name: Acquire accessible OA source documents
        run: |
          python -m pipeline.papers.collector.download


      # ------------------------------------------------------
      # 7. Inspect download report
      # ------------------------------------------------------

      - name: Inspect paper download report
        run: |
          echo "========================================"
          echo "Paper download report"
          echo "========================================"

          if [ ! -f "data/raw/papers/download_report.json" ]; then
            echo "download_report.json was not created."
            exit 1
          fi

          python -m json.tool \
            data/raw/papers/download_report.json \
            | head -n 80


      # ------------------------------------------------------
      # 8. Print download statistics
      #
      # documents 전체 내용을 출력하지 않고
      # 핵심 카운트만 Actions 로그에 출력한다.
      # ------------------------------------------------------

      - name: Show paper acquisition statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/raw/papers/download_report.json"
          )

          report = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              "SELECTED_COUNT="
              + str(
                  report.get(
                      "selected_count",
                      0,
                  )
              )
          )

          print(
              "DOWNLOADED_PDF="
              + str(
                  report.get(
                      "downloaded_pdf",
                      0,
                  )
              )
          )

          print(
              "DOWNLOADED_HTML="
              + str(
                  report.get(
                      "downloaded_html",
                      0,
                  )
              )
          )

          print(
              "DOWNLOADED_TOTAL="
              + str(
                  report.get(
                      "downloaded_total",
                      0,
                  )
              )
          )

          print(
              "UNAVAILABLE="
              + str(
                  report.get(
                      "unavailable",
                      0,
                  )
              )
          )

          print(
              "CACHE_HITS="
              + str(
                  report.get(
                      "cache_hits",
                      0,
                  )
              )
          )

          print(
              "WORKER_EXCEPTIONS="
              + str(
                  report.get(
                      "worker_exceptions",
                      0,
                  )
              )
          )
          PY


      # ------------------------------------------------------
      # 9. Extract / clean / quality assessment
      #
      # 여기서 실제 논문 품질을 검사한다.
      #
      # 예:
      #
      # minimum = 50
      #
      # 영어 + 구조 + 본문 품질을 만족하는 논문이
      # 최소 기준 이상이어야 다음으로 진행한다.
      # ------------------------------------------------------

      - name: Extract and assess paper sections
        run: |
          MINIMUM="${{ github.event.inputs.minimum }}"

          if [ -z "$MINIMUM" ]; then
            MINIMUM=50
          fi

          echo "MINIMUM_ENGLISH_PAPERS=$MINIMUM"

          python -m pipeline.papers.extractor.process \
            --minimum-english "$MINIMUM"


      # ------------------------------------------------------
      # 10. Entity Resolution
      # ------------------------------------------------------

      - name: Resolve paper entities
        run: |
          python -m pipeline.common.entity_resolver \
            --kind papers


      # ------------------------------------------------------
      # 11. Inspect processed output
      # ------------------------------------------------------

      - name: Inspect processed paper outputs
        run: |
          echo "========================================"
          echo "Processed paper outputs"
          echo "========================================"

          if [ ! -d "data/processed/papers" ]; then
            echo "data/processed/papers does not exist."
            exit 1
          fi

          find data/processed/papers \
            -maxdepth 5 \
            -type f \
            -print \
            | sort


      # ------------------------------------------------------
      # 12. Validate processed result exists
      # ------------------------------------------------------

      - name: Validate paper processing output
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(
              "data/processed/papers"
          )

          if not root.exists():
              raise SystemExit(
                  "Processed paper directory does not exist."
              )

          json_files = list(
              root.rglob("*.json")
          )

          if not json_files:
              raise SystemExit(
                  "No processed JSON files were created."
              )

          print(
              "PROCESSED_JSON_COUNT="
              + str(
                  len(json_files)
              )
          )

          for path in sorted(json_files):
              print(path)
          PY


      # ------------------------------------------------------
      # 13. Upload DB transfer artifact
      #
      # GitHub Hosted Runner
      #       ↓
      # Artifact
      #       ↓
      # EC2 Self Hosted Runner
      # ------------------------------------------------------

      - name: Upload papers for PostgreSQL load
        uses: actions/upload-artifact@v4

        with:
          name: papers-db-transfer-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            data/raw/papers/
            data/processed/papers/

          if-no-files-found: error

          retention-days: 1



  # ==========================================================
  # JOB 2
  #
  # EC2 Self Hosted Runner
  #
  # Artifact
  #    ↓
  # PostgreSQL
  # ==========================================================

  load-postgres:
    name: Load papers into PostgreSQL

    needs:
      - collect

    runs-on:
      - self-hosted
      - ec2-db

    timeout-minutes: 30

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:

      # ------------------------------------------------------
      # 14. Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main


      # ------------------------------------------------------
      # 15. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ------------------------------------------------------
      # 16. Dependencies
      # ------------------------------------------------------

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt


      # ------------------------------------------------------
      # 17. Download artifact
      # ------------------------------------------------------

      - name: Download processed paper artifact
        uses: actions/download-artifact@v4

        with:
          name: papers-db-transfer-${{ github.run_id }}-${{ github.run_attempt }}

          path: data


      # ------------------------------------------------------
      # 18. Verify transferred files
      # ------------------------------------------------------

      - name: Verify transferred paper data
        run: |
          echo "========================================"
          echo "EC2 runner"
          echo "========================================"

          hostname

          echo "========================================"
          echo "Transferred paper files"
          echo "========================================"

          if [ ! -d "data/processed/papers" ]; then
            echo "Processed paper directory was not transferred."
            exit 1
          fi

          find data/processed/papers \
            -maxdepth 5 \
            -type f \
            -print \
            | sort


      # ------------------------------------------------------
      # 19. Validate PostgreSQL configuration
      #
      # 값 자체는 절대 출력하지 않는다.
      # ------------------------------------------------------

      - name: Validate PostgreSQL configuration
        run: |
          python - <<'PY'
          import os

          required = [
              "POSTGRES_HOST",
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing PostgreSQL configuration: "
                  + ", ".join(missing)
              )

          print(
              "POSTGRES_CONFIGURATION=SUCCESS"
          )

          print(
              "POSTGRES_HOST=127.0.0.1"
          )
          PY


      # ------------------------------------------------------
      # 20. PostgreSQL TCP test
      # ------------------------------------------------------

      - name: Test PostgreSQL connectivity
        run: |
          python - <<'PY'
          import os
          import socket

          host = "127.0.0.1"

          port = int(
              os.environ.get(
                  "POSTGRES_PORT",
                  "5432",
              ).strip()
          )

          print(
              "Testing PostgreSQL connectivity..."
          )

          print(
              f"Target host: {host}"
          )

          print(
              f"Target port: {port}"
          )

          try:
              with socket.create_connection(
                  (
                      host,
                      port,
                  ),
                  timeout=10,
              ):
                  print(
                      "POSTGRES_TCP_CHECK=SUCCESS"
                  )

          except TimeoutError:
              print(
                  "POSTGRES_TCP_CHECK=TIMEOUT"
              )

              raise SystemExit(1)

          except ConnectionRefusedError:
              print(
                  "POSTGRES_TCP_CHECK=REFUSED"
              )

              raise SystemExit(1)

          except socket.gaierror:
              print(
                  "POSTGRES_TCP_CHECK="
                  "HOSTNAME_RESOLUTION_FAILED"
              )

              raise SystemExit(1)

          except OSError as exc:
              print(
                  "POSTGRES_TCP_CHECK=FAILED:"
                  + type(exc).__name__
              )

              raise SystemExit(1)
          PY


      # ------------------------------------------------------
      # 21. PostgreSQL Loader
      #
      # 기존 paper loader를 그대로 사용한다.
      #
      # DB:
      # 127.0.0.1
      #
      # 즉 GitHub Hosted Runner에서 공인 PostgreSQL 포트를
      # 접근하지 않는다.
      # ------------------------------------------------------

      - name: Load processed papers into PostgreSQL
        run: |
          python -m pipeline.papers.loader.postgres \
            --apply \
            --report data/processed/papers/load_report.json


      # ------------------------------------------------------
      # 22. Print load report
      # ------------------------------------------------------

      - name: Show PostgreSQL paper load report
        if: always()

        run: |
          if [ -f "data/processed/papers/load_report.json" ]; then

            echo "========================================"
            echo "PostgreSQL paper load report"
            echo "========================================"

            python -m json.tool \
              data/processed/papers/load_report.json

          else

            echo "load_report.json was not created."

          fi


      # ------------------------------------------------------
      # 23. Preserve final artifacts
      # ------------------------------------------------------

      - name: Preserve paper ingestion artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: papers-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            data/raw/papers/
            data/processed/papers/

          if-no-files-found: warn

          retention-days: 30