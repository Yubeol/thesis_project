name: Ingest papers

on:
  workflow_dispatch:
    inputs:
      target:
        description: New OpenAlex metadata candidates to acquire
        required: false
        type: number
        default: 300

      minimum:
        description: Minimum ready English papers required for incremental ingestion
        required: false
        type: number
        default: 1

  schedule:
    # UTC 16:30 = KST next day 01:30
    - cron: '30 16 * * *'

permissions:
  contents: read

concurrency:
  group: ingest-papers
  cancel-in-progress: false

jobs:

  # ==========================================================
  # JOB 0
  #
  # EC2 self-hosted runner
  #
  # PostgreSQL
  #   ↓
  # existing_papers.json
  #   ↓
  # GitHub Artifact
  # ==========================================================

  snapshot-existing-papers:
    name: Snapshot existing PostgreSQL papers

    runs-on:
      - self-hosted
      - ec2-db

    timeout-minutes: 20

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:

      # ------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main


      # ------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt


      # ------------------------------------------------------
      # 4. PostgreSQL configuration
      # ------------------------------------------------------

      - name: Validate PostgreSQL configuration
        run: |
          python - <<'PY'
          import os

          required = [
              "POSTGRES_HOST",
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing PostgreSQL configuration: "
                  + ", ".join(missing)
              )

          print("POSTGRES_CONFIGURATION=SUCCESS")
          PY


      # ------------------------------------------------------
      # 5. PostgreSQL connectivity
      # ------------------------------------------------------

      - name: Test PostgreSQL connectivity
        run: |
          python - <<'PY'
          import os
          import socket

          host = "127.0.0.1"

          port = int(
              os.environ.get(
                  "POSTGRES_PORT",
                  "5432",
              ).strip()
          )

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=10,
              ):
                  print(
                      "POSTGRES_TCP_CHECK=SUCCESS"
                  )

          except TimeoutError:
              print(
                  "POSTGRES_TCP_CHECK=TIMEOUT"
              )
              raise SystemExit(1)

          except ConnectionRefusedError:
              print(
                  "POSTGRES_TCP_CHECK=REFUSED"
              )
              raise SystemExit(1)

          except OSError as exc:
              print(
                  "POSTGRES_TCP_CHECK=FAILED:"
                  + type(exc).__name__
              )
              raise SystemExit(1)
          PY


      # ------------------------------------------------------
      # 6. Export existing papers
      #
      # 현재 PostgreSQL에 저장된 논문의
      # DOI / source_url을 snapshot으로 만든다.
      #
      # OpenAlex 수집 단계에서 이 목록을 이용해
      # 이미 DB에 있는 논문은 미리 제외한다.
      # ------------------------------------------------------

      - name: Export existing paper identities
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path

          from pipeline.common.database import connect

          output = Path(
              "data/state/existing_papers.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          with connect(
              read_only=True
          ) as conn:

              with conn.cursor() as cursor:

                  cursor.execute(
                      """
                      SELECT
                          title,
                          doi,
                          source_url
                      FROM public.papers
                      ORDER BY paper_id
                      """
                  )

                  rows = cursor.fetchall()

          payload = {
              "schema_version": 1,

              "exported_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "paper_count":
                  len(rows),

              "papers": [
                  {
                      "title":
                          row[0],

                      "doi":
                          row[1],

                      "source_url":
                          row[2],
                  }
                  for row in rows
              ],
          }

          temp = output.with_suffix(
              ".tmp"
          )

          temp.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          temp.replace(
              output
          )

          print(
              "EXISTING_PAPER_COUNT="
              + str(
                  len(rows)
              )
          )

          print(
              "EXISTING_PAPER_SNAPSHOT=SUCCESS"
          )
          PY


      # ------------------------------------------------------
      # 7. Upload snapshot artifact
      # ------------------------------------------------------

      - name: Upload existing paper snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paper-existing-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

          path: data/state/existing_papers.json

          if-no-files-found: error

          retention-days: 1



  # ==========================================================
  # JOB 1
  #
  # GitHub Hosted Runner
  #
  # existing_papers.json
  #       ↓
  # OpenAlex 신규 논문
  #       ↓
  # PDF / HTML
  #       ↓
  # Extract / Clean / Quality
  # ==========================================================

  collect:
    name: Collect and preprocess new papers

    needs:
      - snapshot-existing-papers

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      # ------------------------------------------------------
      # 8. Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main


      # ------------------------------------------------------
      # 9. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ------------------------------------------------------
      # 10. Dependencies
      # ------------------------------------------------------

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt


      # ------------------------------------------------------
      # 11. Tests
      # ------------------------------------------------------

      - name: Run paper pipeline tests
        run: |
          python -m unittest discover \
            -s tests/pipeline \
            -p 'test_paper*.py' \
            -v


      # ------------------------------------------------------
      # 12. Download PostgreSQL snapshot
      # ------------------------------------------------------

      - name: Download existing paper snapshot
        uses: actions/download-artifact@v4
        with:
          name: paper-existing-snapshot-${{ github.run_id }}-${{ github.run_attempt }}

          path: data/state


      # ------------------------------------------------------
      # 13. Verify snapshot
      # ------------------------------------------------------

      - name: Verify existing paper snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/state/existing_papers.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "existing_papers.json "
                  "was not downloaded"
              )

          payload = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          papers = payload.get(
              "papers"
          )

          if not isinstance(
              papers,
              list,
          ):
              raise SystemExit(
                  "existing_papers.json "
                  "does not contain papers list"
              )

          print(
              "EXISTING_PAPER_COUNT="
              + str(
                  len(papers)
              )
          )

          print(
              "EXISTING_PAPER_SNAPSHOT=READY"
          )
          PY


      # ------------------------------------------------------
      # 14. OpenAlex
      #
      # target = 신규 후보 목표 수
      #
      # DB에 이미 있는 DOI/source_url은 제외하고
      # 신규 후보가 target에 도달할 때까지
      # cursor pagination을 진행한다.
      # ------------------------------------------------------

      - name: Collect new OpenAlex paper metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

        run: |
          TARGET="${{ github.event.inputs.target }}"

          if [ -z "$TARGET" ]; then
            TARGET=300
          fi

          echo "NEW_PAPER_TARGET=$TARGET"

          python -m pipeline.papers.collector.openalex \
            --target "$TARGET" \
            --minimum 1 \
            --pages-per-query 20 \
            --existing data/state/existing_papers.json


      # ------------------------------------------------------
      # 15. OpenAlex statistics
      # ------------------------------------------------------

      - name: Show OpenAlex collection statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/raw/papers/collection_report.json"
          )

          if not path.is_file():
              raise SystemExit(
                  "collection_report.json "
                  "was not created"
              )

          report = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          keys = [
              "existing_snapshot_count",
              "raw_results",
              "relevant_results_before_existing_filter",
              "existing_filtered",
              "unique_new_candidates",
              "selected_count",
              "new_target",
              "new_target_met",
              "cached_pages",
              "fetched_pages",
          ]

          for key in keys:
              print(
                  f"{key.upper()}="
                  f"{report.get(key)}"
              )

          print(
              "EXISTING_MATCH_REASONS="
              + json.dumps(
                  report.get(
                      "existing_match_reasons",
                      {},
                  ),
                  ensure_ascii=True,
                  sort_keys=True,
              )
          )
          PY


      # ------------------------------------------------------
      # 16. Download OA source
      #
      # 개별 논문 다운로드 실패는
      # download.py 내부에서 unavailable 처리한다.
      # ------------------------------------------------------

      - name: Acquire accessible OA source documents
        run: |
          python -m pipeline.papers.collector.download


      # ------------------------------------------------------
      # 17. Download report
      # ------------------------------------------------------

      - name: Inspect paper download report
        run: |
          if [ ! -f "data/raw/papers/download_report.json" ]; then

            echo "download_report.json was not created."

            exit 1

          fi

          python -m json.tool \
            data/raw/papers/download_report.json \
            | head -n 80


      # ------------------------------------------------------
      # 18. Acquisition statistics
      # ------------------------------------------------------

      - name: Show paper acquisition statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/raw/papers/download_report.json"
          )

          report = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          for key in (
              "selected_count",
              "downloaded_pdf",
              "downloaded_html",
              "downloaded_total",
              "unavailable",
              "cache_hits",
              "worker_exceptions",
          ):
              print(
                  f"{key.upper()}="
                  f"{report.get(key, 0)}"
              )
          PY


      # ------------------------------------------------------
      # 19. Extract / Clean / Quality
      #
      # 증분 수집이므로:
      #
      # READY 1편 이상
      # → 성공
      #
      # 품질 기준 자체를 낮추는 것이 아니다.
      # 품질 검사를 통과한 논문만 다음 단계로 넘긴다.
      # ------------------------------------------------------

      - name: Extract and assess paper sections
        run: |
          MINIMUM="${{ github.event.inputs.minimum }}"

          if [ -z "$MINIMUM" ]; then
            MINIMUM=1
          fi

          echo "MINIMUM_READY_ENGLISH_PAPERS=$MINIMUM"

          python -m pipeline.papers.extractor.process \
            --minimum-english "$MINIMUM"


      # ------------------------------------------------------
      # 20. Entity Resolution
      # ------------------------------------------------------

      - name: Resolve paper entities
        run: |
          python -m pipeline.common.entity_resolver \
            --kind papers


      # ------------------------------------------------------
      # 21. Inspect processed output
      # ------------------------------------------------------

      - name: Inspect processed paper outputs
        run: |
          if [ ! -d "data/processed/papers" ]; then

            echo "data/processed/papers does not exist."

            exit 1

          fi

          find data/processed/papers \
            -maxdepth 5 \
            -type f \
            -print \
            | sort


      # ------------------------------------------------------
      # 22. Validate processed output
      # ------------------------------------------------------

      - name: Validate paper processing output
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(
              "data/processed/papers"
          )

          if not root.exists():
              raise SystemExit(
                  "Processed paper directory "
                  "does not exist"
              )

          json_files = list(
              root.rglob(
                  "*.json"
              )
          )

          if not json_files:
              raise SystemExit(
                  "No processed JSON files "
                  "were created"
              )

          print(
              "PROCESSED_JSON_COUNT="
              + str(
                  len(
                      json_files
                  )
              )
          )

          ready = (
              root
              / "papers_ready.json"
          )

          if not ready.is_file():
              raise SystemExit(
                  "papers_ready.json "
                  "was not created"
              )

          print(
              "PAPERS_READY_JSON=SUCCESS"
          )
          PY


      # ------------------------------------------------------
      # 23. Transfer artifact to EC2
      # ------------------------------------------------------

      - name: Upload papers for PostgreSQL load
        uses: actions/upload-artifact@v4
        with:
          name: papers-db-transfer-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            data/raw/papers/
            data/processed/papers/

          if-no-files-found: error

          retention-days: 1



  # ==========================================================
  # JOB 2
  #
  # EC2 self-hosted runner
  #
  # Processed papers
  #       ↓
  # PostgreSQL
  # ==========================================================

  load-postgres:
    name: Load papers into PostgreSQL

    needs:
      - collect

    runs-on:
      - self-hosted
      - ec2-db

    timeout-minutes: 30

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:

      # ------------------------------------------------------
      # 24. Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main


      # ------------------------------------------------------
      # 25. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ------------------------------------------------------
      # 26. Dependencies
      # ------------------------------------------------------

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt


      # ------------------------------------------------------
      # 27. Download artifact
      # ------------------------------------------------------

      - name: Download processed paper artifact
        uses: actions/download-artifact@v4
        with:
          name: papers-db-transfer-${{ github.run_id }}-${{ github.run_attempt }}

          path: data


      # ------------------------------------------------------
      # 28. Verify transferred data
      # ------------------------------------------------------

      - name: Verify transferred paper data
        run: |
          hostname

          if [ ! -d "data/processed/papers" ]; then

            echo "Processed paper directory was not transferred."

            exit 1

          fi

          if [ ! -f "data/processed/papers/papers_ready.json" ]; then

            echo "papers_ready.json was not transferred."

            exit 1

          fi

          find data/processed/papers \
            -maxdepth 5 \
            -type f \
            -print \
            | sort


      # ------------------------------------------------------
      # 29. PostgreSQL configuration
      # ------------------------------------------------------

      - name: Validate PostgreSQL configuration
        run: |
          python - <<'PY'
          import os

          required = [
              "POSTGRES_HOST",
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing PostgreSQL configuration: "
                  + ", ".join(missing)
              )

          print(
              "POSTGRES_CONFIGURATION=SUCCESS"
          )

          print(
              "POSTGRES_HOST=127.0.0.1"
          )
          PY


      # ------------------------------------------------------
      # 30. PostgreSQL connectivity
      # ------------------------------------------------------

      - name: Test PostgreSQL connectivity
        run: |
          python - <<'PY'
          import os
          import socket

          host = "127.0.0.1"

          port = int(
              os.environ.get(
                  "POSTGRES_PORT",
                  "5432",
              ).strip()
          )

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=10,
              ):
                  print(
                      "POSTGRES_TCP_CHECK=SUCCESS"
                  )

          except TimeoutError:
              print(
                  "POSTGRES_TCP_CHECK=TIMEOUT"
              )
              raise SystemExit(1)

          except ConnectionRefusedError:
              print(
                  "POSTGRES_TCP_CHECK=REFUSED"
              )
              raise SystemExit(1)

          except socket.gaierror:
              print(
                  "POSTGRES_TCP_CHECK="
                  "HOSTNAME_RESOLUTION_FAILED"
              )
              raise SystemExit(1)

          except OSError as exc:
              print(
                  "POSTGRES_TCP_CHECK=FAILED:"
                  + type(exc).__name__
              )
              raise SystemExit(1)
          PY


      # ------------------------------------------------------
      # 31. Load PostgreSQL
      #
      # loader가 최종적으로 다시
      # DOI / source_url / content_hash
      # 중복 검사를 수행한다.
      # ------------------------------------------------------

      - name: Load processed papers into PostgreSQL
        run: |
          python -m pipeline.papers.loader.postgres \
            --apply \
            --report data/processed/papers/load_report.json


      # ------------------------------------------------------
      # 32. Load report
      # ------------------------------------------------------

      - name: Show PostgreSQL paper load report
        if: always()
        run: |
          if [ -f "data/processed/papers/load_report.json" ]; then

            python -m json.tool \
              data/processed/papers/load_report.json

          else

            echo "load_report.json was not created."

          fi


      # ------------------------------------------------------
      # 33. Preserve artifacts
      # ------------------------------------------------------

      - name: Preserve paper ingestion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papers-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            data/raw/papers/
            data/processed/papers/

          if-no-files-found: warn

          retention-days: 30
