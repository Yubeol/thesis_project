name: Ingest papers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Maximum metadata candidates to acquire
        type: number
        default: 300

      minimum:
        description: Minimum English full papers passing quality checks
        type: number
        default: 50

  schedule:
    # UTC 16:30 = 한국시간 다음날 01:30
    - cron: '30 16 * * *'

permissions:
  contents: read

concurrency:
  group: ingest-papers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt

      - name: Test paper pipeline
        run: |
          python -m unittest discover \
            -s tests/pipeline \
            -p 'test_paper*.py' \
            -v

      - name: Collect paper metadata
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TARGET: ${{ inputs.target || 300 }}
        run: |
          python -m pipeline.papers.collector.openalex \
            --target "$TARGET" \
            --minimum 1

      - name: Acquire accessible OA source documents
        run: |
          python -m pipeline.papers.collector.download

      - name: Extract and assess paper sections
        continue-on-error: true
        env:
          MINIMUM: ${{ inputs.minimum || 50 }}
        run: |
          python -m pipeline.papers.extractor.process \
            --minimum-english "$MINIMUM"

      - name: Create PostgreSQL runtime environment
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "POSTGRES_HOST",
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
          ]

          missing = [
              key
              for key in keys
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing PostgreSQL secrets: "
                  + ", ".join(missing)
              )

          text = "\n".join(
              f"{key}={os.environ[key]}"
              for key in keys
          )

          Path(".env.runtime").write_text(
              text + "\n",
              encoding="utf-8",
          )
          PY

      - name: Load processed papers into PostgreSQL
        run: |
          python -m pipeline.papers.loader.postgres \
            --env-file .env.runtime \
            --apply \
            --report data/processed/papers/load_report.json

      - name: Delete PostgreSQL runtime environment
        if: always()
        run: |
          rm -f .env.runtime

      - name: Preserve paper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/papers/
            data/processed/papers/
          if-no-files-found: error
          retention-days: 30