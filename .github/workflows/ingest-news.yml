name: Ingest news

on:
  workflow_dispatch:

  schedule:
    # 3시간마다 자동 실행
    - cron: '0 */3 * * *'

permissions:
  contents: read

concurrency:
  group: ingest-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -------------------------------------------------
      # 1. Repository checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2. Python setup
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------
      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt
          python -m pip install "openai>=2,<3"

      # -------------------------------------------------
      # 4. Run unit tests
      # -------------------------------------------------
      - name: Test news pipeline
        run: |
          python -m unittest discover \
            -s tests/pipeline \
            -p 'test_news*.py' \
            -v

      # -------------------------------------------------
      # 5. Collect RSS candidates
      # -------------------------------------------------
      - name: Collect recent publisher RSS candidates
        id: collection
        run: |
          python -m pipeline.news.collector.rss

      # -------------------------------------------------
      # 6. Acquire / preprocess / classify / deduplicate
      # -------------------------------------------------
      - name: Acquire preprocess classify and deduplicate news
        continue-on-error: true
        run: |
          python -m pipeline.news.cleaner.process \
            --minimum 1

      # -------------------------------------------------
      # 7. Translate Korean news into English for RAG
      # -------------------------------------------------
      - name: Translate Korean news for RAG
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pipeline.news.translator.translate \
            --workers 2 \
            --minimum-ready 1

      # -------------------------------------------------
      # 8. Create temporary PostgreSQL environment file
      # -------------------------------------------------
      - name: Create PostgreSQL runtime environment
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "POSTGRES_HOST",
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
          ]

          missing = [
              key
              for key in keys
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing PostgreSQL secrets: "
                  + ", ".join(missing)
              )

          values = {}

          for key in keys:
              values[key] = os.environ[key].strip()

          text = "\n".join(
              f"{key}={values[key]}"
              for key in keys
          )

          Path(".env.runtime").write_text(
              text + "\n",
              encoding="utf-8",
          )

          print("PostgreSQL runtime environment created.")
          print("Configured variables:", ", ".join(keys))
          PY

      # -------------------------------------------------
      # 9. Test TCP connectivity to PostgreSQL
      # -------------------------------------------------
      - name: Test PostgreSQL TCP connectivity
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: |
          python - <<'PY'
          import os
          import socket

          host = os.environ["POSTGRES_HOST"].strip()
          port = int(
              os.environ.get(
                  "POSTGRES_PORT",
                  "5432",
              ).strip()
          )

          print("Testing PostgreSQL TCP connectivity...")
          print(f"Target port: {port}")

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=10,
              ):
                  print(
                      "POSTGRES_TCP_CHECK=SUCCESS"
                  )

          except TimeoutError:
              print(
                  "POSTGRES_TCP_CHECK=TIMEOUT"
              )
              raise SystemExit(1)

          except ConnectionRefusedError:
              print(
                  "POSTGRES_TCP_CHECK=REFUSED"
              )
              raise SystemExit(1)

          except socket.gaierror:
              print(
                  "POSTGRES_TCP_CHECK="
                  "HOSTNAME_RESOLUTION_FAILED"
              )
              raise SystemExit(1)

          except OSError as exc:
              print(
                  "POSTGRES_TCP_CHECK=FAILED:"
                  + type(exc).__name__
              )
              raise SystemExit(1)
          PY

      # -------------------------------------------------
      # 10. Load processed news into PostgreSQL
      # -------------------------------------------------
      - name: Load processed news into PostgreSQL
        run: |
          python -m pipeline.news.loader.postgres \
            --input data/processed/news/news_ready.json \
            --env-file .env.runtime \
            --apply \
            --report data/processed/news/load_report.json

      # -------------------------------------------------
      # 11. Remove temporary database credentials
      # -------------------------------------------------
      - name: Delete PostgreSQL runtime environment
        if: always()
        run: |
          rm -f .env.runtime

      # -------------------------------------------------
      # 12. Preserve pipeline artifacts
      # -------------------------------------------------
      - name: Preserve news artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/news/
            data/processed/news/
          if-no-files-found: warn
          retention-days: 7
