name: Ingest news

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: read

concurrency:
  group: ingest-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt
          python -m pip install "openai>=2,<3"

      - name: Test news pipeline
        run: |
          python -m unittest discover \
            -s tests/pipeline \
            -p 'test_news*.py' \
            -v

      - name: Collect recent publisher RSS candidates
        id: collection
        run: |
          python -m pipeline.news.collector.rss

      - name: Acquire preprocess classify and deduplicate news
        continue-on-error: true
        run: |
          python -m pipeline.news.cleaner.process \
            --minimum 1

      - name: Translate Korean news for RAG
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pipeline.news.translator.translate \
            --workers 2 \
            --minimum-ready 1

      - name: Create PostgreSQL runtime environment
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          keys = [
              "POSTGRES_HOST",
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
          ]

          missing = [
              key
              for key in keys
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing PostgreSQL secrets: "
                  + ", ".join(missing)
              )

          text = "\n".join(
              f"{key}={os.environ[key]}"
              for key in keys
          )

          Path(".env.runtime").write_text(
              text + "\n",
              encoding="utf-8",
          )
          PY

      - name: Load processed news into PostgreSQL
        run: |
          python -m pipeline.news.loader.postgres \
            --input data/processed/news/news_ready.json \
            --env-file .env.runtime \
            --apply \
            --report data/processed/news/load_report.json

      - name: Delete PostgreSQL runtime environment
        if: always()
        run: |
          rm -f .env.runtime

      - name: Preserve news artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/news/
            data/processed/news/
          if-no-files-found: warn
          retention-days: 7