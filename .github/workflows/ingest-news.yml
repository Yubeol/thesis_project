name: Ingest news

on:
  workflow_dispatch:

  schedule:
    # 3시간마다 자동 실행
    - cron: '0 */3 * * *'

permissions:
  contents: read

concurrency:
  group: ingest-news-${{ github.ref }}
  cancel-in-progress: false


# =========================================================
# JOB 1
# GitHub hosted runner
#
# RSS 수집
# → 본문 추출
# → 전처리
# → 분류
# → 중복 제거
# → 한국어 뉴스 영어 번역
# =========================================================
jobs:
  collect:
    name: Collect and preprocess news
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # -------------------------------------------------
      # 1. Repository checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # 2. Python setup
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # -------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------
      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt
          python -m pip install "openai>=2,<3"
          python -m pip install "psycopg[binary]>=3,<4" pgvector tiktoken python-dotenv


      # -------------------------------------------------
      # 4. Run unit tests
      # -------------------------------------------------
      - name: Test news pipeline
        run: |
          python -m unittest discover \
            -s tests/pipeline \
            -p 'test_news*.py' \
            -v


      # -------------------------------------------------
      # 5. Collect RSS candidates
      # -------------------------------------------------
      - name: Collect recent publisher RSS candidates
        id: collection
        run: |
          python -m pipeline.news.collector.rss


      # -------------------------------------------------
      # 6. Acquire / preprocess / classify / deduplicate
      # -------------------------------------------------
      - name: Acquire preprocess classify and deduplicate news
        continue-on-error: true
        run: |
          python -m pipeline.news.cleaner.process \
            --minimum 1


      # -------------------------------------------------
      # 7. Resolve verified names before translation
      # -------------------------------------------------
      - name: Resolve news entities
        run: |
          python -m pipeline.common.entity_resolver \
            --kind news \
            --input data/processed/news/news.json \
            --output data/processed/news/news_resolved.json

      # -------------------------------------------------
      # 8. Translate Korean news into English for RAG
      # -------------------------------------------------
      - name: Translate Korean news for RAG
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pipeline.news.translator.translate \
            --input data/processed/news/news_resolved.json \
            --workers 2 \
            --minimum-ready 1


      # -------------------------------------------------
      # 8. Verify processed news exists
      # -------------------------------------------------
      - name: Verify processed news
        run: |
          if [ ! -f "data/processed/news/news_ready.json" ]; then
            echo "news_ready.json was not created."
            exit 1
          fi

          echo "NEWS_READY_FILE=FOUND"
          ls -lh data/processed/news/news_ready.json


      # -------------------------------------------------
      # 9. Transfer data to EC2 DB job
      #
      # DB 적재 job은 다른 runner에서 실행되므로
      # artifact를 통해 데이터를 전달한다.
      # -------------------------------------------------
      - name: Upload news data for database load
        uses: actions/upload-artifact@v4
        with:
          name: news-db-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/news/
            data/processed/news/
          if-no-files-found: error
          retention-days: 1



  # =======================================================
  # JOB 2
  # EC2 self-hosted runner
  #
  # PostgreSQL이 존재하는 EC2 내부에서 실행한다.
  #
  # GitHub hosted runner → EC2:5432 연결을 하지 않기 때문에
  # Security Group 때문에 발생했던 TIMEOUT을 피할 수 있다.
  # =======================================================
  load-postgres:
    name: Load news into PostgreSQL

    needs:
      - collect

    runs-on:
      - self-hosted
      - ec2-db

    timeout-minutes: 30

    steps:

      # -------------------------------------------------
      # 10. Repository checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # 11. Python setup
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # -------------------------------------------------
      # 12. Install DB pipeline dependencies
      # -------------------------------------------------
      # 12. Install DB + RAG dependencies
      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt
          python -m pip install "openai>=2,<3"
          python -m pip install "psycopg[binary]>=3,<4" pgvector tiktoken python-dotenv


      # -------------------------------------------------
      # 13. Download processed news from collect job
      #
      # artifact 내부의 raw/, processed/를
      # data/ 아래에 복원한다.
      # -------------------------------------------------
      - name: Download processed news
        uses: actions/download-artifact@v4
        with:
          name: news-db-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: data


      # -------------------------------------------------
      # 14. Verify downloaded files
      # -------------------------------------------------
      - name: Verify downloaded news data
        run: |
          echo "Current runner:"
          hostname

          echo "Checking processed news file..."

          if [ ! -f "data/processed/news/news_ready.json" ]; then
            echo "news_ready.json not found after artifact download."
            echo "Downloaded files:"
            find data -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "NEWS_READY_FILE=FOUND"
          ls -lh data/processed/news/news_ready.json


      # -------------------------------------------------
      # 15. Create temporary PostgreSQL environment
      #
      # 중요:
      # 이 job 자체가 PostgreSQL과 같은 EC2에서 실행되므로
      # 공인 IP를 사용하지 않고 localhost를 사용한다.
      # -------------------------------------------------
      - name: Create PostgreSQL runtime environment
        env:
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          required = [
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing PostgreSQL secrets: "
                  + ", ".join(missing)
              )

          values = {
              "POSTGRES_HOST": "127.0.0.1",
              "POSTGRES_PORT": os.environ["POSTGRES_PORT"].strip(),
              "POSTGRES_DB": os.environ["POSTGRES_DB"].strip(),
              "POSTGRES_USER": os.environ["POSTGRES_USER"].strip(),
              "POSTGRES_PASSWORD": os.environ["POSTGRES_PASSWORD"].strip(),
          }

          env_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "news-postgres.env"
          )

          text = "\n".join(
              f"{key}={value}"
              for key, value in values.items()
          )

          env_path.write_text(
              text + "\n",
              encoding="utf-8",
          )

          print("PostgreSQL runtime environment created.")
          print("POSTGRES_HOST=127.0.0.1")
          print("POSTGRES_PORT configured.")
          print("POSTGRES_DB configured.")
          print("POSTGRES_USER configured.")
          print("POSTGRES_PASSWORD configured.")
          PY


      # -------------------------------------------------
      # 16. Test PostgreSQL local TCP connectivity
      # -------------------------------------------------
      - name: Test PostgreSQL TCP connectivity
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: |
          python - <<'PY'
          import os
          import socket

          host = os.environ["POSTGRES_HOST"].strip()
          port = int(
              os.environ.get(
                  "POSTGRES_PORT",
                  "5432",
              ).strip()
          )

          print("Testing local PostgreSQL TCP connectivity...")
          print(f"Target host: {host}")
          print(f"Target port: {port}")

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=10,
              ):
                  print("POSTGRES_TCP_CHECK=SUCCESS")

          except TimeoutError:
              print("POSTGRES_TCP_CHECK=TIMEOUT")
              raise SystemExit(1)

          except ConnectionRefusedError:
              print("POSTGRES_TCP_CHECK=REFUSED")
              raise SystemExit(1)

          except socket.gaierror:
              print(
                  "POSTGRES_TCP_CHECK="
                  "HOSTNAME_RESOLUTION_FAILED"
              )
              raise SystemExit(1)

          except OSError as exc:
              print(
                  "POSTGRES_TCP_CHECK=FAILED:"
                  + type(exc).__name__
              )
              raise SystemExit(1)
          PY


            # -------------------------------------------------
      # 17. Load processed news into PostgreSQL
      # -------------------------------------------------
      - name: Load processed news into PostgreSQL
        run: |
          python -m pipeline.news.loader.postgres \
            --input data/processed/news/news_ready.json \
            --env-file "$RUNNER_TEMP/news-postgres.env" \
            --apply \
            --report data/processed/news/load_report.json

      # -------------------------------------------------
      # 18. Chunk and embed newly loaded news for RAG
      # -------------------------------------------------
      - name: Index new news for RAG
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_EMBEDDING_MODEL: text-embedding-3-small

          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          RAG_CHUNK_TOKENS: "700"
          RAG_CHUNK_OVERLAP: "100"

        run: |
          python - <<'PY'
          from rag.embedding.indexer import index_news

          result = index_news(
              force=False,
          )

          print("NEWS_RAG_INDEX_RESULT:")
          print(result)
          PY

      # -------------------------------------------------
      # 19. Verify RAG indexing result
      # -------------------------------------------------
      - name: Verify news RAG indexing
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

        run: |
          python - <<'PY'
          from rag.vector import get_connection

          with get_connection() as conn:
              news_count = conn.execute(
                  "SELECT COUNT(*) FROM news"
              ).fetchone()[0]

              chunk_count = conn.execute(
                  "SELECT COUNT(*) FROM news_chunks"
              ).fetchone()[0]

              missing_embedding = conn.execute(
                  """
                  SELECT COUNT(*)
                  FROM news_chunks
                  WHERE embedding IS NULL
                  """
              ).fetchone()[0]

              unindexed_news = conn.execute(
                  """
                  SELECT COUNT(*)
                  FROM news AS n
                  WHERE NOT EXISTS (
                      SELECT 1
                      FROM news_chunks AS nc
                      WHERE nc.news_id = n.news_id
                  )
                  """
              ).fetchone()[0]

              freshness = conn.execute(
                  """
                  SELECT
                      MAX(published_at),
                      COUNT(*) FILTER (
                          WHERE published_at >= CURRENT_TIMESTAMP - INTERVAL '90 days'
                      ),
                      COUNT(*) FILTER (
                          WHERE published_at >= CURRENT_TIMESTAMP - INTERVAL '3 years'
                      )
                  FROM news
                  """
              ).fetchone()

          print(f"NEWS_COUNT={news_count}")
          print(f"NEWS_CHUNKS={chunk_count}")
          print(f"MISSING_EMBEDDING={missing_embedding}")
          print(f"UNINDEXED_NEWS={unindexed_news}")
          print(f"LATEST_NEWS_PUBLISHED_AT={freshness[0]}")
          print(f"NEWS_PUBLISHED_LAST_90_DAYS={freshness[1]}")
          print(f"NEWS_PUBLISHED_LAST_3_YEARS={freshness[2]}")

          if missing_embedding != 0:
              raise SystemExit(
                  "Found news chunks without embeddings."
              )

          if freshness[1] == 0:
              print(
                  "WARNING: No news published in the last 90 days is currently indexed."
              )
          PY

      # -------------------------------------------------
      # 20. Show load report
      # -------------------------------------------------
      - name: Show PostgreSQL load report
        if: always()
        run: |
          if [ -f "data/processed/news/load_report.json" ]; then
            echo "PostgreSQL load report:"
            python -m json.tool \
              data/processed/news/load_report.json
          else
            echo "load_report.json was not created."
          fi

      # -------------------------------------------------
      # 21. Delete temporary DB credentials
      # -------------------------------------------------
      - name: Delete PostgreSQL runtime environment
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/news-postgres.env"

      # -------------------------------------------------
      # 22. Preserve final pipeline artifacts
      # -------------------------------------------------
      - name: Preserve news artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/news/
            data/processed/news/
          if-no-files-found: warn
          retention-days: 7
