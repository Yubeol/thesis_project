name: Graph sync

on:
  # 수동 실행
  workflow_dispatch:

  # 뉴스 또는 논문 적재가 성공하면 자동 실행
  workflow_run:
    workflows:
      - Ingest news
      - Ingest papers
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: graph-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync PostgreSQL data to Neo4j

    # 수동 실행이거나,
    # Ingest news / Ingest papers가 성공했을 때만 실행
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # PostgreSQL / Neo4j가 설치된 EC2에서 직접 실행
    runs-on:
      - self-hosted
      - ec2-db

    timeout-minutes: 30

    env:
      # -------------------------------------------------
      # PostgreSQL
      # 같은 EC2 안에 있으므로 공인 IP를 사용하지 않는다.
      # -------------------------------------------------
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      # -------------------------------------------------
      # Neo4j
      # 같은 EC2 안의 Bolt 포트에 직접 접속
      # -------------------------------------------------
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

    steps:
      # -------------------------------------------------
      # 1. Repository checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main


      # -------------------------------------------------
      # 2. Python setup
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # -------------------------------------------------
      # 3. Install dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/common/requirements.txt
          python -m pip install "neo4j>=5,<6"


      # -------------------------------------------------
      # 4. Check required environment variables
      #
      # Secret 값 자체는 출력하지 않는다.
      # -------------------------------------------------
      - name: Validate database configuration
        run: |
          python - <<'PY'
          import os

          required = [
              "POSTGRES_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
              "NEO4J_URI",
              "NEO4J_USER",
              "NEO4J_PASSWORD",
          ]

          missing = [
              key
              for key in required
              if not os.environ.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing required configuration: "
                  + ", ".join(missing)
              )

          print("DATABASE_CONFIGURATION=OK")
          PY


      # -------------------------------------------------
      # 5. Test PostgreSQL TCP connection
      # -------------------------------------------------
      - name: Test PostgreSQL connectivity
        run: |
          python - <<'PY'
          import os
          import socket

          host = "127.0.0.1"
          port = int(
              os.environ.get(
                  "POSTGRES_PORT",
                  "5432",
              ).strip()
          )

          print("Testing PostgreSQL...")
          print(f"Host: {host}")
          print(f"Port: {port}")

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=10,
              ):
                  print(
                      "POSTGRES_TCP_CHECK=SUCCESS"
                  )

          except TimeoutError:
              print(
                  "POSTGRES_TCP_CHECK=TIMEOUT"
              )
              raise SystemExit(1)

          except ConnectionRefusedError:
              print(
                  "POSTGRES_TCP_CHECK=REFUSED"
              )
              raise SystemExit(1)

          except OSError as exc:
              print(
                  "POSTGRES_TCP_CHECK=FAILED:"
                  + type(exc).__name__
              )
              raise SystemExit(1)
          PY


      # -------------------------------------------------
      # 6. Test Neo4j Bolt TCP connection
      # -------------------------------------------------
      - name: Test Neo4j connectivity
        run: |
          python - <<'PY'
          import socket

          host = "127.0.0.1"
          port = 7687

          print("Testing Neo4j Bolt...")
          print(f"Host: {host}")
          print(f"Port: {port}")

          try:
              with socket.create_connection(
                  (host, port),
                  timeout=10,
              ):
                  print(
                      "NEO4J_TCP_CHECK=SUCCESS"
                  )

          except TimeoutError:
              print(
                  "NEO4J_TCP_CHECK=TIMEOUT"
              )
              raise SystemExit(1)

          except ConnectionRefusedError:
              print(
                  "NEO4J_TCP_CHECK=REFUSED"
              )
              raise SystemExit(1)

          except OSError as exc:
              print(
                  "NEO4J_TCP_CHECK=FAILED:"
                  + type(exc).__name__
              )
              raise SystemExit(1)
          PY


      # -------------------------------------------------
      # 7. Verify Python DB drivers
      # -------------------------------------------------
      - name: Verify database drivers
        run: |
          python - <<'PY'
          import psycopg
          import neo4j

          print("PSYCOPG_IMPORT=SUCCESS")
          print("NEO4J_DRIVER_IMPORT=SUCCESS")
          PY


      # -------------------------------------------------
      # 8. Run Graph Sync
      #
      # PostgreSQL의 Paper / News 데이터를 읽어서
      # Neo4j로 동기화한다.
      #
      # Entity는 entity_id 기준으로 MERGE한다.
      # -------------------------------------------------
      - name: Synchronize graph
        run: |
          python -m rag.graph.sync.synchronizer \
            --source both


      # -------------------------------------------------
      # 9. Success marker
      # -------------------------------------------------
      - name: Graph sync completed
        run: |
          echo "GRAPH_SYNC=SUCCESS"