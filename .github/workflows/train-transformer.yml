name: Train transformer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; full always repeats the GPU dry-run gate
        type: choice
        options: [dry-run, full]
        default: dry-run
        required: true
      epochs:
        description: Full-training epochs
        type: number
        default: 3
      dataset_run_id:
        description: Optional completed run ID containing a dataset artifact; empty exports PostgreSQL
        type: string
        default: ''
      dataset_artifact:
        description: Artifact name from dataset_run_id (required when a run ID is supplied)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: transformer-gpu-training
  cancel-in-progress: false

jobs:
  export-dataset:
    if: inputs.dataset_run_id == ''
    runs-on: [self-hosted, ec2-db]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export-only dependencies
        run: python -m pip install -r transformer/configs/requirements-dataset.txt
      - name: Export PostgreSQL papers and build a read-only dataset snapshot
        env:
          POSTGRES_HOST: '127.0.0.1'
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
       run: |
          python -m transformer.dataset.build_dataset \
            --output-dir artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Transfer dataset without database credentials
        uses: actions/upload-artifact@v4
        with:
          name: transformer-dataset-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

  train:
    needs: export-dataset
    if: ${{ !cancelled() && (needs.export-dataset.result == 'success' || (needs.export-dataset.result == 'skipped' && inputs.dataset_run_id != '')) }}
    runs-on: [self-hosted, Windows, X64, gpu-train]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
      TRAIN_MODE: ${{ inputs.mode }}
      TRAIN_EPOCHS: ${{ inputs.epochs }}
      DATASET_RUN_ID: ${{ inputs.dataset_run_id }}
      DATASET_ARTIFACT: ${{ inputs.dataset_artifact }}
      RUN_OUTPUT: artifacts/training-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manual inputs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TRAIN_MODE -notin @('dry-run', 'full')) { throw 'Unknown mode' }
          $epochs = 0.0
          if (-not [double]::TryParse($env:TRAIN_EPOCHS, [ref]$epochs) -or $epochs -le 0 -or $epochs -gt 100) { throw 'epochs must be greater than 0 and at most 100' }
          if ($env:DATASET_RUN_ID -and ($env:DATASET_RUN_ID -notmatch '^\d+$' -or -not $env:DATASET_ARTIFACT)) { throw 'Supply a numeric dataset_run_id and its dataset_artifact name' }
      - name: Prepare persistent Python 3.12 CUDA environment and verify GPU
        run: |
          $ErrorActionPreference = 'Stop'
          $trainingVenv = Join-Path $env:RUNNER_TOOL_CACHE 'paper-transformer-py312-cu126'
          & ./transformer/training/setup-windows.ps1 -VenvPath $trainingVenv
          if ($LASTEXITCODE -ne 0) { throw 'GPU environment setup failed' }
      - name: Download dataset exported in this run
        if: inputs.dataset_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: transformer-dataset-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/training
      - name: Download an existing dataset artifact (no DB dependency)
        if: inputs.dataset_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dataset_artifact }}
          run-id: ${{ inputs.dataset_run_id }}
          github-token: ${{ github.token }}
          path: data/training
      - name: GPU forward/backward, checkpoint save and reload dry-run
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:TRAIN_PYTHON -m transformer.training.train --dataset-dir data/training --device cuda --dry-run --epochs $env:TRAIN_EPOCHS --output-dir "$env:RUN_OUTPUT/dry-run"
          if ($LASTEXITCODE -ne 0) { throw 'GPU dry-run failed; full training is blocked' }
      - name: Full training after matching dry-run success
        if: inputs.mode == 'full'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:TRAIN_PYTHON -m transformer.training.train --dataset-dir data/training --device cuda --epochs $env:TRAIN_EPOCHS --dry-run-receipt "$env:RUN_OUTPUT/dry-run/dry_run_success.json" --output-dir "$env:RUN_OUTPUT/model"
          if ($LASTEXITCODE -ne 0) { throw 'Full training failed; inspect logs and failure.json' }
      - name: Upload model, tokenizer, checkpoints, metadata and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformer-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
