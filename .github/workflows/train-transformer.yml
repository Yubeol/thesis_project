name: Train transformer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; full repeats the GPU dry-run gate before training
        type: choice
        options:
          - dry-run
          - full
        default: dry-run
        required: true

      epochs:
        description: Full-training epochs
        type: number
        default: 3
        required: true

      dataset_run_id:
        description: Optional completed run ID containing a dataset artifact; empty exports PostgreSQL
        type: string
        default: ''
        required: false

      dataset_artifact:
        description: Artifact name from dataset_run_id
        type: string
        default: ''
        required: false


permissions:
  contents: read
  actions: read


concurrency:
  group: transformer-gpu-training
  cancel-in-progress: false


jobs:

  # ============================================================
  # 1. EC2 PostgreSQL -> JSONL Dataset
  # ============================================================
  export-dataset:
    if: ${{ inputs.dataset_run_id == '' }}

    runs-on:
      - self-hosted
      - ec2-db

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # EC2에서는 setup-python 정상 사용
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Install dataset dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r transformer/configs/requirements-dataset.txt


      # ----------------------------------------------------------
      # PostgreSQL -> section-level JSONL
      # ----------------------------------------------------------
      - name: Export PostgreSQL papers and build dataset
        env:
          POSTGRES_HOST: '127.0.0.1'
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

        run: |
          python -m transformer.dataset.build_dataset \
            --output-dir artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}


      # ----------------------------------------------------------
      # manifest 확인
      # ----------------------------------------------------------
      - name: Inspect dataset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}"
          )

          manifest_path = root / "manifest.json"

          if not manifest_path.exists():
              raise SystemExit("manifest.json not found")

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          print("=" * 70)
          print("DATASET MANIFEST")
          print("=" * 70)

          print(
              json.dumps(
                  manifest,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("=" * 70)
          PY


      # ----------------------------------------------------------
      # train / validation / test 개수 및 section 비율 확인
      # ----------------------------------------------------------
      - name: Inspect dataset counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}"
          )

          print("=" * 70)
          print("DATASET COUNTS")
          print("=" * 70)

          grand_total = 0

          for split in ("train", "validation", "test"):

              path = root / f"{split}.jsonl"

              if not path.exists():
                  raise SystemExit(f"{path} not found")

              rows = []

              with path.open(encoding="utf-8") as handle:
                  for line in handle:
                      if line.strip():
                          rows.append(json.loads(line))

              section_counts = {
                  "Introduction": 0,
                  "Body": 0,
                  "Conclusion": 0,
              }

              for row in rows:
                  section = row.get("section")

                  if section in section_counts:
                      section_counts[section] += 1

              grand_total += len(rows)

              print(f"{split}: {len(rows)} samples")
              print(f"sections: {section_counts}")
              print()

          print(f"TOTAL: {grand_total} samples")
          print("=" * 70)
          PY


      # ----------------------------------------------------------
      # 학습 데이터 몇 건 직접 로그에 출력
      # ----------------------------------------------------------
      - name: Inspect training samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}"
          )

          path = root / "train.jsonl"

          rows = []

          with path.open(encoding="utf-8") as handle:
              for line in handle:

                  if not line.strip():
                      continue

                  rows.append(json.loads(line))

                  if len(rows) >= 6:
                      break


          print("=" * 70)
          print("TRAINING SAMPLE INSPECTION")
          print("=" * 70)


          for index, row in enumerate(rows, 1):

              print()
              print("#" * 70)
              print(f"SAMPLE {index}")

              print("paper_id:", row.get("paper_id"))
              print("section:", row.get("section"))

              value = row.get("input", {})

              print()
              print("[TITLE]")
              print(value.get("title"))

              print()
              print("[TOPIC]")
              print(value.get("topic"))

              print()
              print("[RESEARCH QUESTION]")
              print(value.get("research_question"))

              print()
              print("[PAPER EVIDENCE]")

              for evidence in value.get("paper_evidence", []):
                  print("-", evidence)

              print()
              print("[NEWS EVIDENCE]")

              for evidence in value.get("news_evidence", []):
                  print("-", evidence)

              print()
              print("[TARGET]")
              print(row.get("target"))


          print()
          print("=" * 70)
          PY


      # ----------------------------------------------------------
      # Dataset Artifact 업로드
      # DB 비밀정보는 포함되지 않음
      # ----------------------------------------------------------
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4

        with:
          name: transformer-dataset-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}/

          if-no-files-found: error

          retention-days: 14



  # ============================================================
  # 2. Windows GTX 1050 Runner
  # ============================================================
  train:

    needs:
      - export-dataset

    if: >-
      ${{
        !cancelled() &&
        (
          needs.export-dataset.result == 'success' ||
          (
            needs.export-dataset.result == 'skipped' &&
            inputs.dataset_run_id != ''
          )
        )
      }}

    runs-on:
      - self-hosted
      - Windows
      - X64
      - gpu-train

    timeout-minutes: 360


    defaults:
      run:
        shell: powershell


    env:
      PYTHONUTF8: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'

      TRAIN_MODE: ${{ inputs.mode }}
      TRAIN_EPOCHS: ${{ inputs.epochs }}

      DATASET_RUN_ID: ${{ inputs.dataset_run_id }}
      DATASET_ARTIFACT: ${{ inputs.dataset_artifact }}

      RUN_OUTPUT: artifacts/training-${{ github.run_id }}-${{ github.run_attempt }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 중요:
      # Windows NETWORK SERVICE Runner에서는
      # actions/setup-python을 사용하지 않는다.
      # ==========================================================


      # ----------------------------------------------------------
      # Workflow 입력값 검증
      # 복잡한 PowerShell if 표현을 사용하지 않는다.
      # ----------------------------------------------------------
      - name: Validate manual inputs
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:TRAIN_MODE -notin @('dry-run', 'full')) {
              throw 'Unknown TRAIN_MODE'
          }

          $epochs = 0.0

          $validEpochs = [double]::TryParse(
              $env:TRAIN_EPOCHS,
              [ref]$epochs
          )

          if (-not $validEpochs) {
              throw 'epochs must be a number'
          }

          if ($epochs -le 0) {
              throw 'epochs must be greater than 0'
          }

          if ($epochs -gt 100) {
              throw 'epochs must be at most 100'
          }

          if ($env:DATASET_RUN_ID) {

              if ($env:DATASET_RUN_ID -notmatch '^\d+$') {
                  throw 'dataset_run_id must be numeric'
              }

              if (-not $env:DATASET_ARTIFACT) {
                  throw 'dataset_artifact is required when dataset_run_id is supplied'
              }
          }

          Write-Host "TRAIN_MODE=$env:TRAIN_MODE"
          Write-Host "TRAIN_EPOCHS=$epochs"

          if ($env:DATASET_RUN_ID) {
              Write-Host "Reusing dataset run: $env:DATASET_RUN_ID"
          }
          else {
              Write-Host "Using dataset exported by this workflow run"
          }

          Write-Host 'Manual inputs validated.'


      # ----------------------------------------------------------
      # Python + PyTorch + CUDA 환경 준비
      # ----------------------------------------------------------
      - name: Prepare persistent Python 3.12 CUDA environment and verify GPU
        run: |
          $ErrorActionPreference = 'Stop'

          $trainingVenv = Join-Path `
              $env:RUNNER_TOOL_CACHE `
              'paper-transformer-py312-cu126'

          Write-Host "Training venv: $trainingVenv"

          & ./transformer/training/setup-windows.ps1 `
              -VenvPath $trainingVenv

          if ($LASTEXITCODE -ne 0) {
              throw 'GPU environment setup failed'
          }


      # ----------------------------------------------------------
      # 이번 실행에서 EC2가 생성한 Dataset 다운로드
      # ----------------------------------------------------------
      - name: Download dataset exported in this run

        if: ${{ inputs.dataset_run_id == '' }}

        uses: actions/download-artifact@v4

        with:
          name: transformer-dataset-${{ github.run_id }}-${{ github.run_attempt }}

          path: data/training


      # ----------------------------------------------------------
      # 과거 Dataset Artifact 재사용
      # ----------------------------------------------------------
      - name: Download an existing dataset artifact

        if: ${{ inputs.dataset_run_id != '' }}

        uses: actions/download-artifact@v4

        with:
          name: ${{ inputs.dataset_artifact }}

          run-id: ${{ inputs.dataset_run_id }}

          github-token: ${{ github.token }}

          path: data/training


      # ----------------------------------------------------------
      # Dataset 파일 확인
      # ----------------------------------------------------------
      - name: Verify downloaded dataset
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(
              'data/training/train.jsonl',
              'data/training/validation.jsonl',
              'data/training/test.jsonl',
              'data/training/manifest.json'
          )

          foreach ($file in $files) {

              if (-not (Test-Path $file)) {
                  throw "Missing dataset file: $file"
              }

              $size = (Get-Item $file).Length

              Write-Host "$file : $size bytes"
          }

          Write-Host 'Dataset files verified.'


      # ----------------------------------------------------------
      # TRAIN_PYTHON 및 CUDA 확인
      # ----------------------------------------------------------
      - name: Verify Python PyTorch and CUDA
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TRAIN_PYTHON) {
              throw 'TRAIN_PYTHON was not set by setup-windows.ps1'
          }

          Write-Host "TRAIN_PYTHON=$env:TRAIN_PYTHON"

          & $env:TRAIN_PYTHON `
              -c "import sys; print('Python:', sys.version)"

          if ($LASTEXITCODE -ne 0) {
              throw 'Python verification failed'
          }


          & $env:TRAIN_PYTHON `
              -c "import torch; print('Torch:', torch.__version__); print('CUDA available:', torch.cuda.is_available()); print('Torch CUDA:', torch.version.cuda); print('GPU:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'NONE')"

          if ($LASTEXITCODE -ne 0) {
              throw 'PyTorch CUDA verification failed'
          }


          & $env:TRAIN_PYTHON `
              -c "import torch, sys; sys.exit(0 if torch.cuda.is_available() else 1)"

          if ($LASTEXITCODE -ne 0) {
              throw 'CUDA is not available; GPU training is blocked'
          }


      # ----------------------------------------------------------
      # Dry Run
      #
      # full을 선택해도 반드시 먼저 dry-run 실행
      # ----------------------------------------------------------
      - name: GPU forward backward checkpoint save and reload dry-run
        run: |
          $ErrorActionPreference = 'Stop'

          & $env:TRAIN_PYTHON `
              -m transformer.training.train `
              --dataset-dir data/training `
              --device cuda `
              --dry-run `
              --epochs $env:TRAIN_EPOCHS `
              --output-dir "$env:RUN_OUTPUT/dry-run"

          if ($LASTEXITCODE -ne 0) {
              throw 'GPU dry-run failed; full training is blocked'
          }

          Write-Host 'GPU dry-run passed.'


      # ----------------------------------------------------------
      # Full Training
      # ----------------------------------------------------------
      - name: Full training after matching dry-run success

        if: ${{ inputs.mode == 'full' }}

        run: |
          $ErrorActionPreference = 'Stop'

          & $env:TRAIN_PYTHON `
              -m transformer.training.train `
              --dataset-dir data/training `
              --device cuda `
              --epochs $env:TRAIN_EPOCHS `
              --dry-run-receipt "$env:RUN_OUTPUT/dry-run/dry_run_success.json" `
              --output-dir "$env:RUN_OUTPUT/model"

          if ($LASTEXITCODE -ne 0) {
              throw 'Full training failed; inspect logs and failure.json'
          }

          Write-Host 'Full Transformer training passed.'


      # ----------------------------------------------------------
      # 결과 Artifact 업로드
      # ----------------------------------------------------------
      - name: Upload model tokenizer checkpoints metadata and logs

        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:
          name: transformer-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            ${{ env.RUN_OUTPUT }}/

          if-no-files-found: warn

          retention-days: 14
