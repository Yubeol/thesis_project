name: Train transformer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; full always repeats the GPU dry-run gate
        type: choice
        options:
          - dry-run
          - full
        default: dry-run
        required: true

      epochs:
        description: Full-training epochs
        type: number
        default: 3

      dataset_run_id:
        description: Optional completed run ID containing a dataset artifact; empty exports PostgreSQL
        type: string
        default: ''

      dataset_artifact:
        description: Artifact name from dataset_run_id (required when a run ID is supplied)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: transformer-gpu-training
  cancel-in-progress: false


jobs:

  # ============================================================
  # 1. EC2 Runner에서 PostgreSQL -> 학습 Dataset 생성
  # ============================================================
  export-dataset:
    if: inputs.dataset_run_id == ''

    runs-on:
      - self-hosted
      - ec2-db

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # EC2에서는 setup-python이 정상 동작하므로 유지
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dataset dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r transformer/configs/requirements-dataset.txt

      - name: Export PostgreSQL papers and build dataset
        env:
          POSTGRES_HOST: '127.0.0.1'
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python -m transformer.dataset.build_dataset \
            --output-dir artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Inspect dataset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}"
          )

          manifest_path = root / "manifest.json"

          if not manifest_path.exists():
              raise SystemExit("manifest.json not found")

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          print("=" * 70)
          print("DATASET MANIFEST")
          print("=" * 70)

          print(
              json.dumps(
                  manifest,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("=" * 70)
          PY

      - name: Inspect dataset counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}"
          )

          print("=" * 70)
          print("DATASET COUNTS")
          print("=" * 70)

          for split in ("train", "validation", "test"):

              path = root / f"{split}.jsonl"

              if not path.exists():
                  raise SystemExit(f"{path} not found")

              rows = []

              with path.open(encoding="utf-8") as f:
                  for line in f:
                      if line.strip():
                          rows.append(json.loads(line))

              print(f"{split}: {len(rows)} samples")

              section_counts = {
                  "Introduction": 0,
                  "Body": 0,
                  "Conclusion": 0,
              }

              for row in rows:
                  section = row.get("section")

                  if section in section_counts:
                      section_counts[section] += 1

              print("section counts:", section_counts)
              print()

          print("=" * 70)
          PY

      - name: Inspect training samples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}"
          )

          path = root / "train.jsonl"

          rows = []

          with path.open(encoding="utf-8") as f:
              for line in f:

                  if line.strip():
                      rows.append(json.loads(line))

                  if len(rows) >= 6:
                      break

          print("=" * 70)
          print("TRAINING SAMPLE INSPECTION")
          print("=" * 70)

          for i, row in enumerate(rows, 1):

              print()
              print("#" * 70)
              print(f"SAMPLE {i}")

              print("# paper_id:", row.get("paper_id"))
              print("# section:", row.get("section"))

              value = row.get("input", {})

              print()
              print("[TITLE]")
              print(value.get("title"))

              print()
              print("[TOPIC]")
              print(value.get("topic"))

              print()
              print("[RESEARCH QUESTION]")
              print(value.get("research_question"))

              print()
              print("[PAPER EVIDENCE]")

              for evidence in value.get("paper_evidence", []):
                  print("-", evidence)

              print()
              print("[NEWS EVIDENCE]")

              for evidence in value.get("news_evidence", []):
                  print("-", evidence)

              print()
              print("[TARGET]")
              print(row.get("target"))

              print()

          print("=" * 70)
          PY

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: transformer-dataset-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dataset-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # 2. Windows GTX 1050 Runner에서 학습
  # ============================================================
  train:
    needs:
      - export-dataset

    if: >-
      ${{
        !cancelled() &&
        (
          needs.export-dataset.result == 'success' ||
          (
            needs.export-dataset.result == 'skipped' &&
            inputs.dataset_run_id != ''
          )
        )
      }}

    runs-on:
      - self-hosted
      - Windows
      - X64
      - gpu-train

    timeout-minutes: 360

    defaults:
      run:
        shell: powershell

    env:
      PYTHONUTF8: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'

      TRAIN_MODE: ${{ inputs.mode }}
      TRAIN_EPOCHS: ${{ inputs.epochs }}

      DATASET_RUN_ID: ${{ inputs.dataset_run_id }}
      DATASET_ARTIFACT: ${{ inputs.dataset_artifact }}

      RUN_OUTPUT: artifacts/training-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 중요:
      # Windows 서비스 계정에서 actions/setup-python@v5를 사용하지 않는다.
      # NETWORK SERVICE의 Registry 권한 문제를 피한다.

      - name: Validate manual inputs
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:TRAIN_MODE -notin @('dry-run', 'full')) {
            throw 'Unknown mode'
          }

          $epochs = 0.0

          if (
              -not [double]::TryParse(
                  $env:TRAIN_EPOCHS,
                  [ref]$epochs
              )
              -or $epochs -le 0
              -or $epochs -gt 100
          ) {
              throw 'epochs must be greater than 0 and at most 100'
          }

          if (
              $env:DATASET_RUN_ID
              -and (
                  $env:DATASET_RUN_ID -notmatch '^\d+$'
                  -or -not $env:DATASET_ARTIFACT
              )
          ) {
              throw 'Supply a numeric dataset_run_id and its dataset_artifact name'
          }

      # ----------------------------------------------------------
      # Python + CUDA 환경 준비
      #
      # actions/setup-python 대신 이 스크립트가 담당
      # ----------------------------------------------------------
      - name: Prepare persistent Python 3.12 CUDA environment and verify GPU
        run: |
          $ErrorActionPreference = 'Stop'

          $trainingVenv = Join-Path `
              $env:RUNNER_TOOL_CACHE `
              'paper-transformer-py312-cu126'

          & ./transformer/training/setup-windows.ps1 `
              -VenvPath $trainingVenv

          if ($LASTEXITCODE -ne 0) {
              throw 'GPU environment setup failed'
          }

      # ----------------------------------------------------------
      # 현재 실행에서 새로 생성한 Dataset 다운로드
      # ----------------------------------------------------------
      - name: Download dataset exported in this run
        if: inputs.dataset_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: transformer-dataset-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/training

      # ----------------------------------------------------------
      # 기존 Dataset Artifact 재사용
      # ----------------------------------------------------------
      - name: Download an existing dataset artifact
        if: inputs.dataset_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dataset_artifact }}
          run-id: ${{ inputs.dataset_run_id }}
          github-token: ${{ github.token }}
          path: data/training

      # ----------------------------------------------------------
      # Dataset 파일 존재 확인
      # ----------------------------------------------------------
      - name: Verify downloaded dataset
        run: |
          $ErrorActionPreference = 'Stop'

          $files = @(
              'data/training/train.jsonl',
              'data/training/validation.jsonl',
              'data/training/test.jsonl',
              'data/training/manifest.json'
          )

          foreach ($file in $files) {

              if (-not (Test-Path $file)) {
                  throw "Missing dataset file: $file"
              }
          }

          Write-Host 'Dataset files verified.'

      # ----------------------------------------------------------
      # GPU 정보 확인
      # ----------------------------------------------------------
      - name: Verify CUDA from training environment
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:TRAIN_PYTHON) {
              throw 'TRAIN_PYTHON was not set by setup-windows.ps1'
          }

          Write-Host "TRAIN_PYTHON=$env:TRAIN_PYTHON"

          & $env:TRAIN_PYTHON -c "import sys; print('Python:', sys.version)"

          & $env:TRAIN_PYTHON -c "import torch; print('Torch:', torch.__version__); print('CUDA available:', torch.cuda.is_available()); print('CUDA version:', torch.version.cuda); print('GPU:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'NONE')"

          if ($LASTEXITCODE -ne 0) {
              throw 'Python/PyTorch CUDA verification failed'
          }

      # ----------------------------------------------------------
      # GPU Dry Run
      # ----------------------------------------------------------
      - name: GPU forward backward checkpoint save and reload dry-run
        run: |
          $ErrorActionPreference = 'Stop'

          & $env:TRAIN_PYTHON `
              -m transformer.training.train `
              --dataset-dir data/training `
              --device cuda `
              --dry-run `
              --epochs $env:TRAIN_EPOCHS `
              --output-dir "$env:RUN_OUTPUT/dry-run"

          if ($LASTEXITCODE -ne 0) {
              throw 'GPU dry-run failed; full training is blocked'
          }

      # ----------------------------------------------------------
      # Full Training
      # ----------------------------------------------------------
      - name: Full training after matching dry-run success
        if: inputs.mode == 'full'
        run: |
          $ErrorActionPreference = 'Stop'

          & $env:TRAIN_PYTHON `
              -m transformer.training.train `
              --dataset-dir data/training `
              --device cuda `
              --epochs $env:TRAIN_EPOCHS `
              --dry-run-receipt "$env:RUN_OUTPUT/dry-run/dry_run_success.json" `
              --output-dir "$env:RUN_OUTPUT/model"

          if ($LASTEXITCODE -ne 0) {
              throw 'Full training failed; inspect logs and failure.json'
          }

      # ----------------------------------------------------------
      # 결과 Artifact 업로드
      # ----------------------------------------------------------
      - name: Upload model tokenizer checkpoints metadata and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformer-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 14
